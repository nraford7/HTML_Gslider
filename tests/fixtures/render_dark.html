<!doctype html><html><head><title>Render fixture</title>
<style>
  :root{--W:1920px;--H:1080px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#2a2a2a;}
  .slide-wrap{width:var(--W);height:var(--H);margin:28px auto;zoom:var(--fit,1);box-shadow:0 10px 50px rgba(0,0,0,.5);position:relative;}
  .slide{width:var(--W);height:var(--H);overflow:hidden;position:relative;}
  .slide.dk{background:#080806;color:#F2EFE8;}
  .slide.lt{background:#F4F0E7;color:#1A1917;}
  h2{font-size:80px;padding:120px;}
  @media print{
    html,body{background:#fff;}
    @page{size:1920px 1080px;margin:0;}
    .slide-wrap{zoom:1 !important;margin:0 !important;box-shadow:none !important;width:1920px !important;height:1080px !important;}
    .slide{width:1920px !important;height:1080px !important;}
  }
</style></head><body>
<div class="slide-wrap" data-slide-id="one"><div class="slide lt"><h2>Ivory slide</h2></div></div>
<div class="slide-wrap" data-slide-id="two"><div class="slide dk"><h2>Dark slide</h2></div></div>
<div class="slide-wrap" data-slide-id="three"><div class="slide lt"><h2>Ivory slide</h2></div></div>
<script>
function fit(){var s=Math.min(1,(window.innerWidth-56)/1920);document.documentElement.style.setProperty('--fit',s);}
fit(); addEventListener('resize',fit);
</script>
</body></html>
